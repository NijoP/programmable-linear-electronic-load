name: Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (none, standard library only)
        run: echo "No dependencies required"
      - name: Run registry checker
        run: python tests/check_repository.py
      - name: Run mutation tests
        run: python -m unittest discover -s tests -p test_repository.py

  matlab-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
      - name: Run MATLAB tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('matlab/project');
            root = plel_setup;
            addpath(fullfile(root, 'tests'));
            test_foundation